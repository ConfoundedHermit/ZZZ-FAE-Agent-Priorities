name: Package release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: Build and attach user package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASSET_NAME: fae-agent-priorities-${{ github.event.release.tag_name }}.zip

    steps:
      - name: Check out released source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate and build extension
        run: npm run check

      - name: Create user package
        working-directory: dist
        run: zip -r "../$ASSET_NAME" .

      - name: Attach package to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "$ASSET_NAME" --repo "$GITHUB_REPOSITORY"
